services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rift-server
    ports:
      - "8087:8087"
    environment:
      - PORT=8087
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_WS_URL: ws://localhost:8087/ws
    container_name: rift-client
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
